{
  "schema_version": 1,
  "kit_version": "1.2.0",
  "application": {
    "id": "meiku",
    "name": "Meiku",
    "family": "ishiku",
    "type": "web_application"
  },
  "platform": {
    "profile": "client-vault-adapter",
    "authentication": "meiku-client-vault",
    "design_system": "ishiku-design-5",
    "security_baseline": "level-2",
    "locale": "en"
  },
  "quality": {
    "default_risk_class": "C"
  },
  "updates": {
    "timezone": "Europe/Berlin",
    "weekly_schedule": {
      "day": "monday",
      "time": "05:00"
    }
  },
  "repository": {
    "default_branch": "main",
    "container_registry": "ghcr.io"
  },
  "verification": {
    "commands": [
      {
        "name": "ishiku-compliance",
        "command": "node .ishiku/kit/scripts/compliance-test .",
        "required_for_verified": true
      },
      {
        "name": "application",
        "command": "python -m compileall -q server.py tests && python -m unittest discover -s tests && node --check js/app.js && node --check js/auth.js && node --check js/crypto.js && node tests/test-crypto.mjs && node tests/test-store.mjs && node tests/test-auth.mjs",
        "required_for_verified": true
      },
      {
        "name": "compose",
        "command": "docker compose --env-file .env.example -f docker-compose.yml config --quiet",
        "required_for_verified": true
      },
      {
        "name": "container",
        "command": "docker build -t meiku:verify .",
        "required_for_verified": true
      }
    ]
  },
  "upstreams": []
}
