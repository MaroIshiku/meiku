name: meiku

services:
  meiku:
    image: ${MEIKU_IMAGE:-ghcr.io/maroishiku/meiku:v0.3.0@sha256:cda86bb824761565306d545a6093da5747544962e998b1b7d470c1673a5a9561}
    container_name: meiku
    hostname: meiku
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 10s

    environment:
      TZ: ${TZ:-Europe/Berlin}
      ISHIKU_DATA_DIR: /data
      ISHIKU_LOG_LEVEL: ${ISHIKU_LOG_LEVEL:-info}
      MEIKU_UID: "10001"
      MEIKU_GID: "10001"
      MEIKU_PORT: "8080"
      MEIKU_ACCESS_LOG: ${MEIKU_ACCESS_LOG:-false}
      MEIKU_TRUST_PROXY: ${MEIKU_TRUST_PROXY:-false}
      # Required. To keep it out of `docker inspect`, mount a secret file at
      # /run/secrets/ishiku_setup_secret instead (see README, "Docker Secrets").
      ISHIKU_SETUP_SECRET: ${ISHIKU_SETUP_SECRET:-}

    ports:
      - target: 8080
        published: ${WEBUI_PORT:-65003}
        protocol: tcp

    volumes:
      - type: bind
        source: ${MEIKU_DATA_PATH:-/DATA/AppData/meiku/data}
        target: /data

    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: "0.50"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

    networks:
      - meiku

    labels:
      icon: "https://raw.githubusercontent.com/MaroIshiku/meiku/main/assets/icons/icon-512.png"
      org.opencontainers.image.title: "Meiku - Profile Share"
      org.opencontainers.image.description: "Private encrypted profile, contact and payment QR vault with local QR generation."
      org.opencontainers.image.source: "https://github.com/MaroIshiku/meiku"
      org.opencontainers.image.url: "https://github.com/MaroIshiku/meiku"

networks:
  meiku:
    name: meiku
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  main: meiku
  author: MaroIshiku
  developer: MaroIshiku
  category: Utilities
  title:
    en_us: Meiku
    de_de: Meiku
  tagline:
    en_us: Profile Share for encrypted contact and payment QR cards.
    de_de: Profile Share for encrypted contact and payment QR cards.
  description:
    en_us: Mobile-first PWA for encrypted private and business profile cards. The server stores only the encrypted token; QR codes and encryption run locally in the browser.
    de_de: Mobile-first PWA for encrypted private and business profile cards. The server stores only the encrypted token; QR codes and encryption run locally in the browser.
  icon: https://raw.githubusercontent.com/MaroIshiku/meiku/main/assets/icons/icon-512.png
  thumbnail: https://raw.githubusercontent.com/MaroIshiku/meiku/main/assets/icons/icon-512.png
  index: /
  port_map: ${WEBUI_PORT:-65003}
  tips:
    before_install:
      en_us: |
        Required: set ISHIKU_SETUP_SECRET to a random value with at least 32 characters before starting.

        Persistent data is stored on the ZimaOS host at /DATA/AppData/meiku/data and mounted into the container at /data. Previous encrypted tokens are kept in /data/history (last 10 versions). On startup Meiku fixes the directory owner to UID/GID 10001 when Docker permits CHOWN.

        Publish the WebUI through HTTPS if you want full PWA, Web Crypto and Service Worker support.
      de_de: |
        Required: set ISHIKU_SETUP_SECRET to a random value with at least 32 characters before starting.

        Persistent data is stored on the ZimaOS host at /DATA/AppData/meiku/data and mounted into the container at /data. Previous encrypted tokens are kept in /data/history (last 10 versions). On startup Meiku fixes the directory owner to UID/GID 10001 when Docker permits CHOWN.

        Publish the WebUI through HTTPS if you want full PWA, Web Crypto and Service Worker support.
