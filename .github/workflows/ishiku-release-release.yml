name: ishiku release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ishiku-pull-request-verify.yml
    with:
      require_all_verified: true

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve release metadata
        id: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          created=$(git show -s --format=%cI HEAD)
          test "$GITHUB_REF_NAME" = "v$version"
          test -n "$version"
          {
            printf 'version=%s\n' "$version"
            printf 'image=%s\n' "$image"
            printf 'created=%s\n' "$created"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: previous
        name: Record the rollback digest
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:latest" 2>/dev/null | sed -n 's/^Digest:[[:space:]]*//p' | head -1 || true)
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Build and publish the release candidate once
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.release.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.release.outputs.created }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            BUILD_DATE=${{ steps.release.outputs.created }}
            GIT_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Scan every published platform of the pushed digest; without a platform
      # Trivy only resolves the runner architecture of a multi-arch index.
      - name: Block known high and critical vulnerabilities (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          timeout: 10m
      - name: Block known high and critical vulnerabilities (linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          timeout: 10m
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Promote the verified digest without rebuilding
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:v$VERSION" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            "$IMAGE@$DIGEST"
      - name: Export the attached multi-platform SBOM
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .SBOM}}' > "release-$VERSION.sbom.json"
      - name: Create the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PREVIOUS_DIGEST: ${{ steps.previous.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          ## $GITHUB_REPOSITORY $VERSION

          Verified multi-architecture image: \`$IMAGE@$DIGEST\`

          This digest passed the repository's full ishiku verification and high/critical vulnerability gate. OCI SBOM and SLSA provenance attestations are attached to the image; the multi-platform SBOM is also attached to this release.

          Roll back by pinning the previous verified image digest: \`$IMAGE@$PREVIOUS_DIGEST\`.
          EOF
          gh release create "v$VERSION" \
            "release-$VERSION.sbom.json#Multi-platform OCI SBOM" \
            --verify-tag \
            --title "$GITHUB_REPOSITORY $VERSION" \
            --notes-file release-notes.md
