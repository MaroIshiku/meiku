name: ishiku verify

on:
  workflow_call:
    inputs:
      require_all_verified:
        description: Fail unless every AppSpec requirement has executed verification evidence
        required: false
        type: boolean
        default: true
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ishiku-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify independently cloned app
        # Strict by default. `inputs` is empty for pull_request/push/dispatch, and
        # github.event_name is the caller's event inside a reusable workflow, so
        # only an explicit `require_all_verified: false` from a caller relaxes it.
        env:
          REQUIRE_ALL_VERIFIED: ${{ format('{0}', inputs.require_all_verified) }}
        run: |
          if [ "$REQUIRE_ALL_VERIFIED" = "false" ]; then
            node .ishiku/kit/scripts/verify-app . --full --allow-unverified-requirements
          else
            node .ishiku/kit/scripts/verify-app . --full
          fi
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ishiku-verification-${{ github.run_id }}
          path: .ishiku/reports/
          if-no-files-found: error
          retention-days: 30
