name: Publish GHCR image

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 5 * * 1"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ishiku-pull-request-verify.yml
    with:
      require_all_verified: true

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve build info
        id: info
        run: printf 'created=%s\n' "$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is pushed under its immutable commit tag first. Exactly that
      # digest is scanned for every published platform; only then are the
      # moving tags promoted. A failed scan therefore never updates `latest`.
      - name: Build and push commit image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/maroishiku/meiku:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.info.outputs.created }}
            SOURCE_REF=${{ github.ref_name }}
            WORKFLOW_RUN=${{ github.run_id }}
          provenance: mode=max
          sbom: true

      - name: Reject critical or high vulnerabilities (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ghcr.io/maroishiku/meiku@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'

      - name: Reject critical or high vulnerabilities (linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ghcr.io/maroishiku/meiku@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/maroishiku/meiku
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Promote scanned digest to latest
        if: github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag ghcr.io/maroishiku/meiku:latest "ghcr.io/maroishiku/meiku@${DIGEST}"
